<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGO Tracker - Data Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.3;
            font-size: 12px;
        }

        .container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Account Switcher */
        .account-switcher {
            background: #1a1a1a;
            border-bottom: 1px solid #39FF14;
            display: flex;
            gap: 2px;
            overflow-x: auto;
            padding: 6px 4px;
            flex-shrink: 0;
        }

        .account-tab {
            padding: 6px 10px;
            background: #222;
            border: 1px solid #39FF14;
            color: #888;
            cursor: pointer;
            white-space: nowrap;
            font-size: 11px;
            flex-shrink: 0;
            transition: all 0.15s;
            font-family: inherit;
        }

        .account-tab:hover {
            background: #333;
        }

        .account-tab.active {
            background: #39FF14;
            color: #000;
            border-color: #39FF14;
            font-weight: bold;
        }

        .account-tab.add-btn {
            background: transparent;
            border: 1px dashed #39FF14;
            color: #39FF14;
            padding: 6px 8px;
        }

        .account-tab.add-btn:hover {
            background: rgba(57, 255, 20, 0.1);
        }

        /* View Toggle */
        .view-toggle {
            display: flex;
            gap: 2px;
            padding: 8px 4px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px 6px;
            background: #222;
            border: 1px solid #39FF14;
            color: #888;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.15s;
            font-family: inherit;
        }

        .toggle-btn.active {
            background: #39FF14;
            color: #000;
        }

        /* Main Content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 6px 4px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* Dashboard */
        .counter-row {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 4px;
            padding: 6px 4px;
            margin-bottom: 2px;
            background: #1a1a1a;
            border-left: 2px solid #39FF14;
            align-items: center;
        }

        .counter-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .counter-value {
            font-size: 13px;
            color: #39FF14;
            font-weight: bold;
            cursor: pointer;
            text-align: right;
            min-width: 40px;
            padding: 2px 4px;
            background: rgba(57, 255, 20, 0.05);
            border: 1px solid transparent;
            font-family: inherit;
        }

        .counter-value:hover {
            border-color: #39FF14;
        }

        .counter-value.editing {
            background: rgba(57, 255, 20, 0.2);
            border-color: #39FF14;
        }

        .counter-value input {
            width: 100%;
            background: #0a0a0a;
            color: #39FF14;
            border: 1px solid #39FF14;
            padding: 2px 4px;
            font-family: inherit;
            font-size: 13px;
            text-align: right;
        }

        .counter-buttons {
            display: flex;
            gap: 2px;
        }

        .btn-mini {
            width: 24px;
            height: 24px;
            padding: 0;
            background: #222;
            border: 1px solid #39FF14;
            color: #39FF14;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            font-family: inherit;
        }

        .btn-mini:hover {
            background: #39FF14;
            color: #000;
        }

        /* Toggle Row */
        .toggle-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 4px;
            padding: 6px 4px;
            margin-bottom: 2px;
            background: #1a1a1a;
            border-left: 2px solid #39FF14;
            align-items: center;
        }

        .toggle-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }

        .toggle-switch {
            width: 40px;
            height: 20px;
            background: #222;
            border: 1px solid #39FF14;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
        }

        .toggle-switch.on {
            background: #39FF14;
        }

        .toggle-switch::after {
            content: '';
            width: 16px;
            height: 16px;
            background: #39FF14;
            position: absolute;
            left: 2px;
            transition: left 0.15s;
        }

        .toggle-switch.on::after {
            background: #000;
            left: 22px;
        }

        /* Inventory */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2px;
        }

        .inventory-item {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 2px;
            padding: 6px 4px;
            background: #1a1a1a;
            border-left: 2px solid #39FF14;
            align-items: center;
        }

        .item-name {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .item-value {
            font-size: 12px;
            color: #39FF14;
            font-weight: bold;
            cursor: pointer;
            text-align: right;
            min-width: 35px;
            padding: 2px 3px;
            background: rgba(57, 255, 20, 0.05);
            border: 1px solid transparent;
            font-family: inherit;
        }

        .item-value:hover {
            border-color: #39FF14;
        }

        .item-value input {
            width: 100%;
            background: #0a0a0a;
            color: #39FF14;
            border: 1px solid #39FF14;
            padding: 2px 3px;
            font-family: inherit;
            font-size: 12px;
            text-align: right;
        }

        .item-buttons {
            display: flex;
            gap: 1px;
        }

        .btn-mini-inv {
            width: 20px;
            height: 20px;
            padding: 0;
            background: #222;
            border: 1px solid #39FF14;
            color: #39FF14;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .btn-mini-inv:hover {
            background: #39FF14;
            color: #000;
        }

        /* Footer Controls */
        .footer {
            display: flex;
            gap: 4px;
            padding: 8px 4px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            flex-shrink: 0;
        }

        .increment-control {
            display: flex;
            gap: 2px;
            flex: 1;
            align-items: center;
        }

        .increment-label {
            font-size: 9px;
            color: #666;
            text-transform: uppercase;
        }

        .increment-btn {
            padding: 4px 6px;
            background: #222;
            border: 1px solid #39FF14;
            color: #39FF14;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            flex: 1;
            font-family: inherit;
        }

        .increment-btn.active {
            background: #39FF14;
            color: #000;
        }

        .reset-btn {
            padding: 6px 10px;
            background: #222;
            border: 1px solid #39FF14;
            color: #39FF14;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: inherit;
        }

        .reset-btn:hover {
            background: rgba(57, 255, 20, 0.2);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #39FF14;
            border-radius: 2px;
        }

        @media (min-width: 600px) {
            .inventory-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Account Switcher -->
        <div class="account-switcher" id="accountSwitcher"></div>

        <!-- View Toggle -->
        <div class="view-toggle">
            <button class="toggle-btn active" data-view="dashboard">DASHBOARD</button>
            <button class="toggle-btn" data-view="inventory">INVENTORY</button>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Dashboard View -->
            <div class="view active" id="dashboard"></div>

            <!-- Inventory View -->
            <div class="view" id="inventory"></div>
        </div>

        <!-- Footer Controls -->
        <div class="footer">
            <div class="increment-control">
                <span class="increment-label">STEP:</span>
                <button class="increment-btn active" data-step="1">1</button>
                <button class="increment-btn" data-step="25">25</button>
                <button class="increment-btn" data-step="50">50</button>
                <button class="increment-btn" data-step="100">100</button>
            </div>
            <button class="reset-btn">RESET DAY</button>
        </div>
    </div>

    <script>
        // App State
        let appState = {
            currentAccount: 0,
            incrementStep: 1,
            accounts: [
                {
                    name: 'ACC01',
                    label: 'Main',
                    dashboard: {
                        pokestops: 12,
                        raidPasses: 3,
                        pokemonCaught: 47,
                        megasEvolved: 2,
                        pokemonTransferred: 8,
                        dailyResearchCompleted: true
                    },
                    inventory: {
                        'Poke Ball': 120,
                        'Great Ball': 45,
                        'Ultra Ball': 12,
                        'Potion': 28,
                        'Super Potion': 15,
                        'Hyper Potion': 8,
                        'Max Potion': 3,
                        'Revive': 6,
                        'Max Revive': 2,
                        'Razz Berry': 22,
                        'Nanab Berry': 18,
                        'Pinap Berry': 31,
                        'Incense': 4,
                        'Lucky Egg': 2,
                        'Star Piece': 1,
                        'Incubator': 3
                    }
                },
                {
                    name: 'ACC02',
                    label: 'Alt',
                    dashboard: {
                        pokestops: 8,
                        raidPasses: 1,
                        pokemonCaught: 23,
                        megasEvolved: 0,
                        pokemonTransferred: 4,
                        dailyResearchCompleted: false
                    },
                    inventory: {
                        'Poke Ball': 85,
                        'Great Ball': 20,
                        'Ultra Ball': 5,
                        'Potion': 12,
                        'Super Potion': 8,
                        'Hyper Potion': 3,
                        'Max Potion': 1,
                        'Revive': 2,
                        'Max Revive': 0,
                        'Razz Berry': 10,
                        'Nanab Berry': 8,
                        'Pinap Berry': 15,
                        'Incense': 1,
                        'Lucky Egg': 0,
                        'Star Piece': 0,
                        'Incubator': 1
                    }
                },
                {
                    name: 'ACC03',
                    label: 'Farm',
                    dashboard: {
                        pokestops: 35,
                        raidPasses: 5,
                        pokemonCaught: 92,
                        megasEvolved: 7,
                        pokemonTransferred: 18,
                        dailyResearchCompleted: true
                    },
                    inventory: {
                        'Poke Ball': 250,
                        'Great Ball': 120,
                        'Ultra Ball': 60,
                        'Potion': 80,
                        'Super Potion': 50,
                        'Hyper Potion': 25,
                        'Max Potion': 10,
                        'Revive': 15,
                        'Max Revive': 8,
                        'Razz Berry': 75,
                        'Nanab Berry': 60,
                        'Pinap Berry': 95,
                        'Incense': 10,
                        'Lucky Egg': 5,
                        'Star Piece': 3,
                        'Incubator': 8
                    }
                }
            ]
        };

        const inventoryItems = [
            'Poke Ball', 'Great Ball', 'Ultra Ball',
            'Potion', 'Super Potion', 'Hyper Potion', 'Max Potion',
            'Revive', 'Max Revive',
            'Razz Berry', 'Nanab Berry', 'Pinap Berry',
            'Incense', 'Lucky Egg', 'Star Piece', 'Incubator'
        ];

        // Utility Functions
        function getCurrentAccount() {
            return appState.accounts[appState.currentAccount];
        }

        // Render Account Switcher
        function renderAccountSwitcher() {
            const switcher = document.getElementById('accountSwitcher');
            switcher.innerHTML = '';

            appState.accounts.forEach((acc, idx) => {
                const tab = document.createElement('button');
                tab.className = `account-tab ${idx === appState.currentAccount ? 'active' : ''}`;
                tab.textContent = acc.name;
                tab.dataset.idx = idx;
                tab.addEventListener('click', () => switchAccount(idx));
                switcher.appendChild(tab);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'account-tab add-btn';
            addBtn.textContent = '+ NEW';
            addBtn.addEventListener('click', () => {
                const newAccounts = appState.accounts.length + 1;
                appState.accounts.push({
                    name: `ACC${String(newAccounts).padStart(2, '0')}`,
                    label: 'New',
                    dashboard: {
                        pokestops: 0,
                        raidPasses: 0,
                        pokemonCaught: 0,
                        megasEvolved: 0,
                        pokemonTransferred: 0,
                        dailyResearchCompleted: false
                    },
                    inventory: inventoryItems.reduce((acc, item) => {
                        acc[item] = 0;
                        return acc;
                    }, {})
                });
                renderAccountSwitcher();
            });
            switcher.appendChild(addBtn);
        }

        function switchAccount(idx) {
            appState.currentAccount = idx;
            renderAccountSwitcher();
            renderDashboard();
            renderInventory();
        }

        // Render Dashboard
        function renderDashboard() {
            const dashboard = document.getElementById('dashboard');
            const acc = getCurrentAccount();
            const stats = acc.dashboard;

            dashboard.innerHTML = `
                ${createCounterRow('Pokestops Spun', 'pokestops', stats.pokestops)}
                ${createCounterRow('Raid Passes', 'raidPasses', stats.raidPasses)}
                ${createCounterRow('Pokemon Caught', 'pokemonCaught', stats.pokemonCaught)}
                ${createCounterRow('Megas Evolved', 'megasEvolved', stats.megasEvolved)}
                ${createCounterRow('Pokemon Transferred', 'pokemonTransferred', stats.pokemonTransferred)}
                ${createToggleRow('Daily Research', 'dailyResearchCompleted', stats.dailyResearchCompleted)}
            `;

            attachDashboardHandlers();
        }

        function createCounterRow(label, key, value) {
            return `
                <div class="counter-row">
                    <div class="counter-label">${label}</div>
                    <div class="counter-value" data-key="${key}" data-type="dashboard">${value}</div>
                    <div class="counter-buttons">
                        <button class="btn-mini" data-action="minus" data-key="${key}">−</button>
                        <button class="btn-mini" data-action="plus" data-key="${key}">+</button>
                    </div>
                </div>
            `;
        }

        function createToggleRow(label, key, value) {
            return `
                <div class="toggle-row">
                    <div class="toggle-label">${label}</div>
                    <div class="toggle-switch ${value ? 'on' : ''}" data-key="${key}" data-type="dashboard"></div>
                </div>
            `;
        }

        function attachDashboardHandlers() {
            const acc = getCurrentAccount();

            // Counter value clicks
            document.querySelectorAll('.counter-value[data-type="dashboard"]').forEach(el => {
                el.addEventListener('click', function() {
                    const key = this.dataset.key;
                    const currentValue = acc.dashboard[key];

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.value = currentValue;
                    this.innerHTML = '';
                    this.appendChild(input);
                    this.classList.add('editing');
                    input.focus();
                    input.select();

                    function saveValue() {
                        const newVal = parseInt(input.value, 10);
                        if (!isNaN(newVal)) {
                            acc.dashboard[key] = newVal;
                        }
                        renderDashboard();
                    }

                    input.addEventListener('blur', saveValue);
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') saveValue();
                        if (e.key === 'Escape') renderDashboard();
                    });
                });
            });

            // Plus/Minus buttons
            document.querySelectorAll('.btn-mini').forEach(btn => {
                btn.addEventListener('click', function() {
                    const action = this.dataset.action;
                    const key = this.dataset.key;
                    const step = appState.incrementStep;

                    if (action === 'plus') {
                        acc.dashboard[key] += step;
                    } else if (action === 'minus') {
                        acc.dashboard[key] = Math.max(0, acc.dashboard[key] - step);
                    }
                    renderDashboard();
                });
            });

            // Toggle switches
            document.querySelectorAll('.toggle-switch[data-type="dashboard"]').forEach(toggle => {
                toggle.addEventListener('click', function() {
                    const key = this.dataset.key;
                    acc.dashboard[key] = !acc.dashboard[key];
                    this.classList.toggle('on');
                });
            });
        }

        // Render Inventory
        function renderInventory() {
            const inventory = document.getElementById('inventory');
            const acc = getCurrentAccount();

            inventory.innerHTML = '<div class="inventory-grid">' +
                inventoryItems.map(item => createInventoryItem(item, acc.inventory[item] || 0)).join('') +
                '</div>';

            attachInventoryHandlers();
        }

        function createInventoryItem(name, value) {
            return `
                <div class="inventory-item">
                    <div class="item-name">${name}</div>
                    <div class="item-value" data-item="${name}" data-type="inventory">${value}</div>
                    <div class="item-buttons">
                        <button class="btn-mini-inv" data-action="minus" data-item="${name}">−</button>
                        <button class="btn-mini-inv" data-action="plus" data-item="${name}">+</button>
                    </div>
                </div>
            `;
        }

        function attachInventoryHandlers() {
            const acc = getCurrentAccount();

            // Item value clicks
            document.querySelectorAll('.item-value[data-type="inventory"]').forEach(el => {
                el.addEventListener('click', function() {
                    const item = this.dataset.item;
                    const currentValue = acc.inventory[item];

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.value = currentValue;
                    this.innerHTML = '';
                    this.appendChild(input);
                    this.classList.add('editing');
                    input.focus();
                    input.select();

                    function saveValue() {
                        const newVal = parseInt(input.value, 10);
                        if (!isNaN(newVal)) {
                            acc.inventory[item] = newVal;
                        }
                        renderInventory();
                    }

                    input.addEventListener('blur', saveValue);
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') saveValue();
                        if (e.key === 'Escape') renderInventory();
                    });
                });
            });

            // Plus/Minus buttons
            document.querySelectorAll('.btn-mini-inv').forEach(btn => {
                btn.addEventListener('click', function() {
                    const action = this.dataset.action;
                    const item = this.dataset.item;
                    const step = appState.incrementStep;

                    if (action === 'plus') {
                        acc.inventory[item] += step;
                    } else if (action === 'minus') {
                        acc.inventory[item] = Math.max(0, acc.inventory[item] - step);
                    }
                    renderInventory();
                });
            });
        }

        // View Toggle
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const view = this.dataset.view;
                document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(view).classList.add('active');

                if (view === 'dashboard') renderDashboard();
                else renderInventory();
            });
        });

        // Increment Step Control
        document.querySelectorAll('.increment-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.increment-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                appState.incrementStep = parseInt(this.dataset.step, 10);
            });
        });

        // Reset Day Button
        document.querySelector('.reset-btn').addEventListener('click', function() {
            const acc = getCurrentAccount();
            acc.dashboard = {
                pokestops: 0,
                raidPasses: 0,
                pokemonCaught: 0,
                megasEvolved: 0,
                pokemonTransferred: 0,
                dailyResearchCompleted: false
            };
            renderDashboard();
        });

        // Initialize
        renderAccountSwitcher();
        renderDashboard();
    </script>
</body>
</html>
