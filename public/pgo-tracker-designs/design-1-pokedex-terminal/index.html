<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Design 1 — Pokédex Terminal</title>
<style>
  :root{
    --shell-red:#d4342c;
    --shell-red-dark:#a8241d;
    --shell-cream:#f2ede1;
    --screen-bg:#9bbf6b;
    --screen-bg-dark:#7fa855;
    --screen-line:#4a6b32;
    --ink:#1f2a17;
    --amber:#e8a33d;
    --blue-btn:#3a6ea5;
    --chrome:#2b2b2b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Courier New', 'Consolas', monospace;
    background:#111;
    display:flex;
    justify-content:center;
    padding:24px 12px;
    color:var(--ink);
  }
  .device{
    width:100%;
    max-width:420px;
    background:linear-gradient(160deg, var(--shell-red) 0%, var(--shell-red-dark) 100%);
    border-radius:28px;
    padding:14px 14px 22px;
    box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 0 0 3px rgba(255,255,255,.15);
    position:relative;
  }
  .device::before{
    content:"";
    position:absolute;
    top:14px; left:14px; right:14px;
    height:10px;
    background:rgba(255,255,255,.25);
    border-radius:6px;
  }
  .hinge-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 4px 14px;
  }
  .power-light{
    width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #7fd8ff, #2a86c9 60%, #124e75);
    box-shadow:0 0 8px 2px rgba(90,200,255,.7), inset 0 0 3px rgba(0,0,0,.4);
    flex-shrink:0;
  }
  .brand{
    font-family:'Trebuchet MS', sans-serif;
    font-weight:800;
    letter-spacing:2px;
    font-size:13px;
    color:var(--shell-cream);
    text-shadow:0 1px 1px rgba(0,0,0,.4);
  }
  .brand small{display:block;font-size:9px;font-weight:600;opacity:.85;letter-spacing:1px;}

  .screen-bezel{
    background:var(--chrome);
    border-radius:16px;
    padding:10px;
    box-shadow:inset 0 0 0 2px #000, 0 2px 6px rgba(0,0,0,.5);
  }
  .screen{
    background:linear-gradient(180deg,var(--screen-bg),var(--screen-bg-dark));
    border-radius:8px;
    box-shadow:inset 0 0 20px rgba(0,0,0,.35), inset 0 0 0 2px var(--screen-line);
    padding:10px 10px 4px;
    position:relative;
    overflow:hidden;
  }
  .scanlines{
    position:absolute;inset:0;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,.06) 0px, rgba(0,0,0,.06) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }

  /* account switcher */
  .accounts{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:2px 2px 10px;
    scrollbar-width:none;
  }
  .accounts::-webkit-scrollbar{display:none;}
  .acct-pill{
    flex:0 0 auto;
    font-family:inherit;
    font-size:11px;
    font-weight:700;
    letter-spacing:.5px;
    padding:7px 12px;
    background:rgba(31,42,23,.12);
    border:2px solid var(--screen-line);
    border-radius:4px;
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
  }
  .acct-pill.active{
    background:var(--ink);
    color:var(--screen-bg);
    box-shadow:0 0 0 2px var(--amber);
  }
  .acct-pill.add{
    background:transparent;
    border-style:dashed;
    opacity:.7;
  }

  /* view toggle */
  .view-toggle{
    display:flex;
    background:rgba(31,42,23,.15);
    border:2px solid var(--screen-line);
    border-radius:4px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .view-toggle button{
    flex:1;
    font-family:inherit;
    font-weight:700;
    font-size:11px;
    letter-spacing:1px;
    padding:8px 4px;
    background:transparent;
    border:none;
    color:var(--ink);
    cursor:pointer;
  }
  .view-toggle button.active{
    background:var(--ink);
    color:var(--screen-bg);
  }

  .crt-header{
    font-size:10px;
    font-weight:700;
    letter-spacing:1px;
    color:var(--screen-line);
    border-bottom:2px dashed var(--screen-line);
    padding-bottom:6px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
  }

  /* dashboard */
  .stat-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,.25);
    border:2px solid var(--screen-line);
    border-radius:6px;
    padding:8px 10px;
    margin-bottom:7px;
  }
  .stat-label{
    font-size:10.5px;
    font-weight:700;
    line-height:1.25;
    max-width:100px;
  }
  .stat-controls{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .stat-value{
    font-size:18px;
    font-weight:800;
    min-width:34px;
    text-align:center;
    background:var(--ink);
    color:var(--screen-bg);
    border-radius:4px;
    padding:2px 4px;
  }
  .btn{
    font-family:inherit;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:800;
  }
  .btn-round{
    width:26px;height:26px;
    font-size:14px;
    background:var(--blue-btn);
    color:#fff;
    box-shadow:0 2px 0 #24507a;
  }
  .btn-round:active{transform:translateY(2px);box-shadow:none;}
  .btn-small{
    font-size:9px;
    padding:5px 6px;
    background:var(--amber);
    color:#3a2400;
    box-shadow:0 2px 0 #a5701c;
  }
  .btn-small:active{transform:translateY(2px);box-shadow:none;}

  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,.25);
    border:2px solid var(--screen-line);
    border-radius:6px;
    padding:8px 10px;
    margin-bottom:10px;
  }
  .toggle-switch{
    width:42px;height:22px;
    border-radius:11px;
    background:var(--screen-line);
    position:relative;
    cursor:pointer;
    border:none;
  }
  .toggle-switch::after{
    content:"";
    position:absolute;
    top:2px;left:2px;
    width:18px;height:18px;
    border-radius:50%;
    background:#fff;
    transition:left .15s;
  }
  .toggle-switch.on{background:var(--amber);}
  .toggle-switch.on::after{left:22px;}

  .reset-btn{
    width:100%;
    padding:9px;
    font-family:inherit;
    font-weight:800;
    letter-spacing:1px;
    font-size:11px;
    background:var(--shell-red);
    color:#fff;
    border:2px solid var(--ink);
    border-radius:6px;
    cursor:pointer;
    box-shadow:0 3px 0 var(--shell-red-dark);
    margin-top:4px;
  }
  .reset-btn:active{transform:translateY(3px);box-shadow:none;}

  /* inventory */
  .increment-select{
    display:flex;
    gap:4px;
    margin-bottom:10px;
    background:rgba(255,255,255,.2);
    border:2px solid var(--screen-line);
    border-radius:6px;
    padding:4px;
  }
  .increment-select button{
    flex:1;
    font-family:inherit;
    font-weight:800;
    font-size:11px;
    padding:6px 0;
    background:transparent;
    border:none;
    border-radius:4px;
    color:var(--ink);
    cursor:pointer;
  }
  .increment-select button.active{
    background:var(--ink);
    color:var(--screen-bg);
  }
  .inv-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,.25);
    border:2px solid var(--screen-line);
    border-radius:6px;
    padding:7px 9px;
    margin-bottom:6px;
  }
  .inv-name{
    font-size:10.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .inv-icon{font-size:13px;}
  .inv-value-input{
    width:44px;
    text-align:center;
    font-family:inherit;
    font-weight:800;
    font-size:14px;
    background:var(--ink);
    color:var(--screen-bg);
    border:none;
    border-radius:4px;
    padding:3px 2px;
  }
  .inv-controls{display:flex;align-items:center;gap:5px;}

  .hidden{display:none !important;}

  .bottom-panel{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 10px 2px;
  }
  .dpad{
    display:grid;
    grid-template-columns:repeat(3,18px);
    grid-template-rows:repeat(3,18px);
    gap:2px;
  }
  .dpad div{background:var(--chrome);border-radius:2px;}
  .dpad div:nth-child(2),.dpad div:nth-child(4),.dpad div:nth-child(6),.dpad div:nth-child(8){background:#1a1a1a;}
  .dpad div:nth-child(1),.dpad div:nth-child(3),.dpad div:nth-child(7),.dpad div:nth-child(9){background:transparent;}
  .ab-buttons{display:flex;gap:8px;}
  .ab-buttons span{
    width:22px;height:22px;border-radius:50%;
    background:var(--blue-btn);
    box-shadow:0 2px 0 #24507a;
    display:inline-block;
  }
  .footer-label{
    text-align:center;
    font-size:9px;
    color:var(--shell-cream);
    opacity:.7;
    letter-spacing:2px;
    margin-top:10px;
  }
</style>
</head>
<body>
<div class="device">
  <div class="hinge-row">
    <div class="power-light"></div>
    <div class="brand">PGO-DEX <small>ACCOUNT TRACKING UNIT</small></div>
  </div>

  <div class="screen-bezel">
    <div class="screen">
      <div class="scanlines"></div>

      <div class="accounts" id="accounts"></div>

      <div class="view-toggle">
        <button class="active" id="tab-dash" onclick="setView('dash')">DASHBOARD</button>
        <button id="tab-inv" onclick="setView('inv')">INVENTORY</button>
      </div>

      <!-- DASHBOARD VIEW -->
      <div id="view-dash">
        <div class="crt-header"><span id="acct-label">TRAINER: ASH</span><span>DAY LOG</span></div>

        <div id="stat-rows"></div>

        <div class="toggle-row">
          <span class="stat-label">DAILY RESEARCH DONE</span>
          <button class="toggle-switch" id="research-toggle" onclick="toggleResearch()"></button>
        </div>

        <button class="reset-btn" onclick="resetDay()">⟲ RESET DAY</button>
      </div>

      <!-- INVENTORY VIEW -->
      <div id="view-inv" class="hidden">
        <div class="crt-header"><span>ITEM BAG</span><span id="step-label">STEP ×1</span></div>

        <div class="increment-select">
          <button class="active" data-step="1" onclick="setStep(1,this)">×1</button>
          <button data-step="25" onclick="setStep(25,this)">×25</button>
          <button data-step="50" onclick="setStep(50,this)">×50</button>
          <button data-step="100" onclick="setStep(100,this)">×100</button>
        </div>

        <div id="inv-rows"></div>
      </div>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="dpad">
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
    </div>
    <div class="ab-buttons"><span></span><span></span></div>
  </div>
  <div class="footer-label">MOCKUP — DESIGN 1 OF 5</div>
</div>

<script>
  const accounts = ["ASH","MISTY","BROCK","GARY","LEAF","RED","BLUE","MAY","DAWN","LUCAS"];
  let activeAccount = 0;

  const statDefs = [
    {key:"stops", label:"POKESTOPS SPUN", icon:""},
    {key:"raids", label:"RAID PASSES", icon:""},
    {key:"caught", label:"POKEMON CAUGHT", icon:""},
    {key:"megas", label:"MEGAS EVOLVED", icon:""},
    {key:"transferred", label:"TRANSFERRED", icon:""},
  ];
  const invDefs = [
    {key:"pokeball", label:"Poke Ball", icon:"⚪"},
    {key:"greatball", label:"Great Ball", icon:"🔵"},
    {key:"ultraball", label:"Ultra Ball", icon:"🟡"},
    {key:"potion", label:"Potion", icon:"💊"},
    {key:"superpotion", label:"Super Potion", icon:"💊"},
    {key:"hyperpotion", label:"Hyper Potion", icon:"💊"},
    {key:"maxpotion", label:"Max Potion", icon:"💊"},
    {key:"revive", label:"Revive", icon:"✚"},
    {key:"maxrevive", label:"Max Revive", icon:"✚"},
    {key:"razz", label:"Razz Berry", icon:"🍓"},
    {key:"nanab", label:"Nanab Berry", icon:"🍌"},
    {key:"pinap", label:"Pinap Berry", icon:"🍍"},
    {key:"incense", label:"Incense", icon:"🌫"},
    {key:"luckyegg", label:"Lucky Egg", icon:"🥚"},
    {key:"starpiece", label:"Star Piece", icon:"⭐"},
    {key:"incubator", label:"Incubator", icon:"🥚"},
  ];

  function makeState(){
    const s = {stats:{}, research:false, inv:{}};
    statDefs.forEach(d => s.stats[d.key] = Math.floor(Math.random()*10));
    invDefs.forEach(d => s.inv[d.key] = Math.floor(Math.random()*80));
    return s;
  }
  const state = accounts.map(makeState);
  let step = 1;
  let view = 'dash';

  function renderAccounts(){
    const el = document.getElementById('accounts');
    el.innerHTML = '';
    accounts.forEach((name,i) => {
      const b = document.createElement('button');
      b.className = 'acct-pill' + (i===activeAccount?' active':'');
      b.textContent = name;
      b.onclick = () => { activeAccount = i; renderAll(); };
      el.appendChild(b);
    });
    const add = document.createElement('button');
    add.className = 'acct-pill add';
    add.textContent = '+';
    el.appendChild(add);
  }

  function renderStats(){
    const el = document.getElementById('stat-rows');
    el.innerHTML = '';
    const s = state[activeAccount];
    statDefs.forEach(d => {
      const row = document.createElement('div');
      row.className = 'stat-row';
      row.innerHTML = `
        <span class="stat-label">${d.label}</span>
        <span class="stat-controls">
          <span class="stat-value" id="val-${d.key}">${s.stats[d.key]}</span>
          <button class="btn btn-round" onclick="bump('${d.key}',1)">+</button>
          <button class="btn btn-small" onclick="bump('${d.key}',5)">+5</button>
        </span>`;
      el.appendChild(row);
    });
    document.getElementById('acct-label').textContent = 'TRAINER: ' + accounts[activeAccount];
    const rt = document.getElementById('research-toggle');
    rt.classList.toggle('on', s.research);
  }

  function bump(key, amt){
    state[activeAccount].stats[key] += amt;
    document.getElementById('val-'+key).textContent = state[activeAccount].stats[key];
  }

  function toggleResearch(){
    const s = state[activeAccount];
    s.research = !s.research;
    document.getElementById('research-toggle').classList.toggle('on', s.research);
  }

  function resetDay(){
    const s = state[activeAccount];
    statDefs.forEach(d => s.stats[d.key] = 0);
    s.research = false;
    renderStats();
  }

  function renderInv(){
    const el = document.getElementById('inv-rows');
    el.innerHTML = '';
    const s = state[activeAccount];
    invDefs.forEach(d => {
      const row = document.createElement('div');
      row.className = 'inv-item';
      row.innerHTML = `
        <span class="inv-name"><span class="inv-icon">${d.icon}</span>${d.label}</span>
        <span class="inv-controls">
          <button class="btn btn-round" onclick="invBump('${d.key}',-1)">–</button>
          <input class="inv-value-input" id="inv-${d.key}" value="${s.inv[d.key]}" onchange="invSet('${d.key}', this.value)">
          <button class="btn btn-round" onclick="invBump('${d.key}',1)">+</button>
        </span>`;
      el.appendChild(row);
    });
  }

  function invBump(key, dir){
    const s = state[activeAccount];
    s.inv[key] = Math.max(0, s.inv[key] + dir*step);
    document.getElementById('inv-'+key).value = s.inv[key];
  }
  function invSet(key, val){
    const n = Math.max(0, parseInt(val)||0);
    state[activeAccount].inv[key] = n;
    document.getElementById('inv-'+key).value = n;
  }

  function setStep(n, btn){
    step = n;
    document.querySelectorAll('.increment-select button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('step-label').textContent = 'STEP ×' + n;
  }

  function setView(v){
    view = v;
    document.getElementById('view-dash').classList.toggle('hidden', v!=='dash');
    document.getElementById('view-inv').classList.toggle('hidden', v!=='inv');
    document.getElementById('tab-dash').classList.toggle('active', v==='dash');
    document.getElementById('tab-inv').classList.toggle('active', v==='inv');
  }

  function renderAll(){
    renderAccounts();
    renderStats();
    renderInv();
  }
  renderAll();
</script>
</body>
</html>
