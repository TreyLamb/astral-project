<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astral Project</title>

    <!-- Installable web app (2026-09-12). This exists for a specific reason and
         is NOT cosmetic: iOS Safari's ITP deletes ALL script-writable storage
         (localStorage AND IndexedDB) after 7 consecutive days without a
         first-party visit, and Firebase Auth keeps its refresh token in exactly
         that storage — so the site "forgot" the login every time a week went by
         between visits. A home-screen web app is exempt from that sweep and
         gets its own storage partition, so a session installed there survives.
         Removing the manifest brings the weekly sign-out back. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e2d42" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The apple-* trio is still required: iOS reads these, not the manifest,
         for standalone mode, the home-screen label and the icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Astral" />
    <!-- "black", not "black-translucent": translucent draws page content up
         underneath the status bar, and body already carries a fixed 80px
         padding-top for the global navbar, so it would collide. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
